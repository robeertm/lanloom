# Lanloom as an add-on: read-only circuit-board map of the local network, opened from the side panel (ingress).
# The version below must equal VERSION in the repository root (tests/test_addon.py keeps them equal).
name: Lanloom
version: "1.54.0"
slug: lanloom
description: Read-only circuit-board map of your local network
url: https://github.com/robeertm/lanloom
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# Host networking is required to see the local network (neighbour table, multicast discovery, this host's
# connections). It opens no privileges: no capabilities are added, no device, no privileged mode.
host_network: true
ingress: true
ingress_port: 7380
panel_icon: mdi:lan
panel_title: Lanloom
panel_admin: true
# Optional: the MQTT output can use the broker the add-on system offers (Settings > MQTT output > broker of the add-on system).
services:
  - mqtt:want
backup: hot
options:
  ingress_role: admin
  direct_access: false
schema:
  ingress_role: list(viewer|operator|admin)
  direct_access: bool

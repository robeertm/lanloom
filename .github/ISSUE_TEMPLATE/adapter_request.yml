name: Adapter request
description: Ask for support for a device family or product (reading its data, or later changing it).
title: "[Adapter] "
body:
  - type: markdown
    attributes:
      value: |
        Never post secrets: no passwords, tokens, API keys, setup codes, passkeys, recovery codes. Do not post private addresses, host names or device names you do not want public.

        Adapters are built in and written by the maintainer; Lanloom never loads code from elsewhere. Contributions come as issues: no code from outside is loaded and pull requests are not merged (see CONTRIBUTING.md). Recorded API replies are welcome if addresses, hardware addresses and names are removed.
  - type: input
    id: family
    attributes:
      label: Device family or product
      description: For example the kind of firewall, switch, access point controller, hypervisor or storage device, and the product line.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Which data should Lanloom read?
      description: For example clients and their ports, rules, interface counters, guests, health, firmware versions.
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware or software version you run
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Kind of interface
      options:
        - Local API (HTTP, JSON or XML)
        - SNMP
        - Message broker (for example MQTT)
        - WebSocket API
        - Other
        - I do not know
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Link to the published API description
      description: A link to the vendor's public documentation or API reference, if there is one.
      placeholder: "https://"
    validations:
      required: false
  - type: dropdown
    id: access
    attributes:
      label: Read only, or also change settings?
      description: Lanloom reads first. Writing is only ever done through the optional executor, with your passkey.
      options:
        - Read only
        - Read now, change later
        - Read and change
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Account types the device offers (a view-only account is best), limits, quirks.
    validations:
      required: false

name: Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: pip install -r requirements.txt pytest==8.3.4 httpx==0.28.1
      - name: Self-test
        run: LANLOOM_DATA=$(mktemp -d) python -m lanloom --selftest
      - name: Tests
        run: python -m pytest -q

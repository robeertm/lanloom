name: Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install
        run: pip install -r requirements.txt pytest==8.3.4 httpx==0.28.1
      - name: Self-test
        run: LANLOOM_DATA=$(mktemp -d) python -m lanloom --selftest
      - name: Tests
        run: python -m pytest -q
      - name: Outbound connections against the allow-list (no telemetry)
        run: python scripts/egress_check.py
      - name: Secret scan (files and history)
        run: python scripts/secret_scan.py --history
      - name: Python dependencies (OSV, critical = red)
        run: python scripts/dep_scan.py python --md "$GITHUB_STEP_SUMMARY"

# Builds the image for amd64 and arm64 and publishes `:<version>` and `:edge`.
# `:latest` and `:<major>` are NOT set here - see promote.yml. They move only after the
# published image itself has been tested.
# Supply chain: the image is scanned before it is built for publishing (security.yml), signed keyless
# (Sigstore, OIDC identity of this workflow on main, no key anywhere) and gets one signed SPDX SBOM per
# platform as an attestation. promote.yml only adds tags to the same digest, so `:latest` carries the
# same signature. Verify: SECURITY.md.
name: Publish image

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# A run that is already going is never cancelled by a later push: the release gate needs the image of
# exactly the commit it checks, and several changes land on main while that image is being built.
# A newer push only waits (and replaces older waiting runs).
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: pip install -r requirements.txt pytest==8.3.4 httpx==0.28.1
      - run: LANLOOM_DATA=$(mktemp -d) python -m lanloom --selftest
      - run: python -m pytest -q
      - name: Outbound connections against the allow-list (no telemetry)
        run: python scripts/egress_check.py
      - name: Secret scan (files and history)
        run: python scripts/secret_scan.py --history
      - name: Python dependencies (OSV, critical = red)
        run: python scripts/dep_scan.py python --md "$GITHUB_STEP_SUMMARY"

  scan:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/security.yml

  build:
    needs: [test, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless signing: short-lived certificate for this workflow, no stored key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "refresh=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # A published version tag never moves: promote.yml points `:latest` at an image that was
      # tested, so overwriting that version later would hand users an untested image.
      # Three outcomes: tag exists -> only `:edge`; tag missing -> version + edge; registry
      # cannot be asked -> stop without publishing anything.
      - name: Never overwrite a published version
        id: tags
        run: |
          set -euo pipefail
          IMG="${{ steps.meta.outputs.image }}"; V="${{ steps.meta.outputs.version }}"
          out="$(docker buildx imagetools inspect "$IMG:$V" 2>&1)" && rc=0 || rc=$?
          if [ "$rc" = 0 ]; then
            echo "::warning::$IMG:$V is already published and stays as it is; only :edge is renewed. Raise VERSION for a new release."
            TAGS="$IMG:edge"
          elif printf '%s' "$out" | grep -qiE 'not found|manifest unknown|MANIFEST_UNKNOWN|denied'; then
            TAGS="$(printf '%s\n%s' "$IMG:$V" "$IMG:edge")"
          else
            echo "::error::Could not ask the registry about $IMG:$V - nothing is published."
            printf '%s\n' "$out"; exit 1
          fi
          { echo "tags<<END_OF_TAGS"; echo "$TAGS"; echo "END_OF_TAGS"; } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BASE_REFRESH=${{ steps.meta.outputs.refresh }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Self-test of the published image (both architectures)
        run: |
          IMG="${{ steps.meta.outputs.image }}:edge"
          for p in linux/amd64 linux/arm64; do
            docker run --rm --platform "$p" --network none --read-only "$IMG" python -m lanloom --selftest
          done
      - name: Supply-chain tools (pinned, SHA-256 checked)
        run: python3 scripts/fetch_tools.py --dest "$RUNNER_TEMP/tools" cosign syft grype
      # Signs the image index of the version (and of :edge when it differs) unless a valid signature from this
      # workflow exists, attaches one signed SPDX SBOM per platform, then verifies both. Re-running is harmless.
      - name: Sign and attach SBOMs (keyless)
        run: |
          set -euo pipefail
          IMG="${{ steps.meta.outputs.image }}"; V="${{ steps.meta.outputs.version }}"
          python3 scripts/sign_image.py publish "$IMG:$V" --version "$V" --tools "$RUNNER_TEMP/tools" --out sbom
          python3 scripts/sign_image.py publish "$IMG:edge" --version "$V-edge" --tools "$RUNNER_TEMP/tools" --out sbom-edge
      - name: Scan the published image (both architectures)
        run: |
          IMG="${{ steps.meta.outputs.image }}"; V="${{ steps.meta.outputs.version }}"
          python3 scripts/dep_scan.py image "registry:$IMG:$V" --platform linux/amd64 --platform linux/arm64 \
            --tools "$RUNNER_TEMP/tools" --json sbom/scan-image.json --md "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sbom-${{ steps.meta.outputs.version }}
          path: sbom/
          if-no-files-found: ignore
          retention-days: 90

# Every commit in this public repository shows its author and committer. This check fails a
# push whose new commits carry anything but a no-reply address for the maintainer's commits.
name: Commit identity

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$AFTER"
          else
            RANGE="$BEFORE..$AFTER"
          fi
          python3 scripts/check_commit_identity.py $RANGE

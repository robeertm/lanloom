# Points `:latest` and `:<major>` at a version that is already published AND tested.
# Started by hand after the release checks ran against exactly that published image.
# Nothing is rebuilt: the existing manifest gets additional tags, byte for byte the same.
name: Promote to latest

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tested version, e.g. 1.0.0"
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote
        env:
          V: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Runs a registry command, retrying (max 3 attempts, 20 s / 60 s backoff) ONLY when
          # its output looks like a transient registry/network error. Everything else fails
          # at once with the original exit code. Output of every attempt stays in the log.
          retry_registry() {
            local attempt=1 max=3 rc out
            local -a delay=(20 60)
            out="$(mktemp)"
            while :; do
              "$@" > "$out" 2>&1 && rc=0 || rc=$?
              cat "$out"
              if [ "$rc" -eq 0 ]; then rm -f "$out"; return 0; fi
              if [ "$attempt" -ge "$max" ] || ! grep -v -i 'permission denied' "$out" | grep -qiE \
                'denied|TLS handshake timeout|i/o timeout|connection reset|connection refused|\bEOF\b|Bad Gateway|Service Unavailable|Gateway Time-?out|(status|code|HTTP/[0-9.]+)[^0-9]{0,3}50[234]\b|too many requests|\b429\b|toomanyrequests|net/http|context deadline exceeded|no such host|Temporary failure in name resolution'; then
                rm -f "$out"; return "$rc"
              fi
              echo "::warning::registry/network error, retry $((attempt + 1))/$max in ${delay[$((attempt - 1))]}s" >&2
              sleep "${delay[$((attempt - 1))]}"
              attempt=$((attempt + 1))
            done
          }
          echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::not a version: $V"; exit 1; }
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          retry_registry docker buildx imagetools inspect "$IMG:$V" >/dev/null
          MAJOR="${V%%.*}"
          retry_registry docker buildx imagetools create -t "$IMG:latest" -t "$IMG:$MAJOR" "$IMG:$V"
          retry_registry docker buildx imagetools inspect "$IMG:latest"
